name: Validate

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  pytest:
    name: Unit testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run pytest
        run: |
          uv run pytest --cov --cov-report=xml --cov-report=term --tb=line

  mypy:
    name: Static type analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run mypy
        run: |
          uv run mypy src tests

  ruff:
    name: Code linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Run ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check
          src: "."

      - name: Run ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --diff
          src: "."
